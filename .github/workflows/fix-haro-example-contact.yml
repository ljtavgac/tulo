name: Fix HARO example contact_email (one-off batch)

# Sets contact_email on the seeded haro_reply example that predates the
# drafting pipeline. See content/scripts/fix_haro_example_contact.py.
on:
  workflow_dispatch: {}

jobs:
  fix-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fix example contact_email
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          OUTREACH_ADMIN_USER: ${{ secrets.OUTREACH_ADMIN_USER }}
          OUTREACH_ADMIN_PASSWORD: ${{ secrets.OUTREACH_ADMIN_PASSWORD }}
        run: |
          python3 content/scripts/fix_haro_example_contact.py
