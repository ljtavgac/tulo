name: Diagnose King Arthur duplicate outreach prospect (one-off diagnostic)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Diagnose
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          OUTREACH_ADMIN_USER: ${{ secrets.OUTREACH_ADMIN_USER }}
          OUTREACH_ADMIN_PASSWORD: ${{ secrets.OUTREACH_ADMIN_PASSWORD }}
        run: python3 content/scripts/diagnose_king_arthur_duplicate.py
