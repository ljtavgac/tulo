name: Fix baking-soda-substitute / baking-powder-vs-baking-soda images (one-off)

on:
  workflow_dispatch:
    inputs:
      target:
        required: false
        default: "prod"
        type: choice
        options:
          - prod
          - staging
      required_commit:
        description: "Commit this target must be serving before writing (the guard-fix commit)"
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Apply fix
        env:
          BACKEND_BASE_URL: ${{ inputs.target == 'prod' && vars.PROD_BACKEND_BASE_URL || vars.BACKEND_BASE_URL }}
          ADMIN_TASK_TOKEN: ${{ inputs.target == 'prod' && secrets.PROD_ADMIN_TASK_TOKEN || secrets.ADMIN_TASK_TOKEN }}
          REQUIRED_COMMIT: ${{ inputs.required_commit }}
        run: python3 content/scripts/fix_baking_soda_baking_powder_images.py
