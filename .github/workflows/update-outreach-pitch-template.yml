name: Update outreach pitch template (one-off batch)

# Rewrites subject/body_preview on every already-queued, not-yet-sent
# real tool_pitch prospect to the current unified tool-links template.
# See content/scripts/update_outreach_pitch_template.py for exactly what
# changes and why. Never approves or sends anything itself.
on:
  workflow_dispatch: {}

jobs:
  update-pitch-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Update pitch template on existing prospects
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          OUTREACH_ADMIN_USER: ${{ secrets.OUTREACH_ADMIN_USER }}
          OUTREACH_ADMIN_PASSWORD: ${{ secrets.OUTREACH_ADMIN_PASSWORD }}
        run: |
          python3 content/scripts/update_outreach_pitch_template.py
