name: Diagnose canonical tag / redirect status (one-off diagnostic)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Diagnose
        env:
          BACKEND_BASE_URL: ${{ vars.PROD_BACKEND_BASE_URL }}
          FRONTEND_BASE_URL: https://tulo.io
        run: python3 content/scripts/diagnose_canonical_tags.py
