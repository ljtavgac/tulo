name: Inspect prospect 382 full content (one-off)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          OUTREACH_ADMIN_USER: ${{ secrets.OUTREACH_ADMIN_USER }}
          OUTREACH_ADMIN_PASSWORD: ${{ secrets.OUTREACH_ADMIN_PASSWORD }}
        run: python3 content/scripts/inspect_prospect_382_full.py
