name: Daily outreach sourcing

# Runs content/scripts/daily_outreach_sourcing.py once a day: crawls a
# fixed set of real food-blog directory pages (no search API, no Semrush --
# plain HTTP scraping), vets each new candidate with Claude against free
# credibility heuristics, and queues up to 20 passing ones for human
# review in the outreach portal. Never sends anything itself -- every
# queued prospect still needs an explicit Approve.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Max prospects to queue this run'
        required: false
        default: '20'
      dry_run:
        description: 'true = print what would be queued without creating anything'
        required: false
        default: 'false'

jobs:
  source-outreach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Source and queue outreach prospects
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          OUTREACH_ADMIN_USER: ${{ secrets.OUTREACH_ADMIN_USER }}
          OUTREACH_ADMIN_PASSWORD: ${{ secrets.OUTREACH_ADMIN_PASSWORD }}
          PIPELINE_ANTHROPIC_API_KEY: ${{ secrets.PIPELINE_ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          ARGS="--count ${{ github.event.inputs.count || '20' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 content/scripts/daily_outreach_sourcing.py $ARGS
