name: Daily outreach sourcing (hub-page crawl)

# Runs content/scripts/daily_outreach_sourcing.py: crawls a fixed set of
# real food-blog directory pages (no search API, no Semrush -- plain HTTP
# scraping), vets each new candidate with Claude against free credibility
# heuristics, and queues passing ones for human review in the outreach
# portal. Never sends anything itself -- every queued prospect still needs
# an explicit Approve.
#
# No longer scheduled on its own -- it's now the last, lowest-priority
# step of daily-link-building.yml (see that workflow), since it shares one
# daily queue quota with backlink_gap_outreach.py, roundup_inclusion_
# outreach.py, broken_link_outreach.py, unlinked_mention_outreach.py, and
# resource_page_outreach.py rather than queuing its own count on top of
# theirs. Kept here as workflow_dispatch only, for a standalone manual run
# (e.g. testing this source in isolation).
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Max prospects to queue this run (default: fill the full remaining shared daily quota)'
        required: false
        default: ''
      dry_run:
        description: 'true = print what would be queued without creating anything'
        required: false
        default: 'false'

jobs:
  source-outreach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 anthropic playwright
          playwright install --with-deps chromium

      - name: Source and queue outreach prospects
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          OUTREACH_ADMIN_USER: ${{ secrets.OUTREACH_ADMIN_USER }}
          OUTREACH_ADMIN_PASSWORD: ${{ secrets.OUTREACH_ADMIN_PASSWORD }}
          PIPELINE_ANTHROPIC_API_KEY: ${{ secrets.PIPELINE_ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.count }}" ]; then
            ARGS="--count ${{ github.event.inputs.count }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 content/scripts/daily_outreach_sourcing.py $ARGS
