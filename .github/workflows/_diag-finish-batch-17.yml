name: _diag finish batch 17 merge

# One-off completion of merge-approved-batch.yml's remaining steps for
# batch 17 after its cherry-pick conflict was resolved manually (see the
# commit this run's ref points at). Mirrors that workflow's own bake +
# push + mark-merged steps exactly, just skipping the cherry-pick (already
# done and pushed to main directly).

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bake batch 17's current staging images onto main
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          ADMIN_TASK_TOKEN: ${{ secrets.ADMIN_TASK_TOKEN }}
        run: |
          set -euo pipefail
          pip install requests
          python3 content/scripts/batch_slugs.py 17 > /tmp/batch_slugs.txt
          cat /tmp/batch_slugs.txt
          python3 content/scripts/bake_images_from_staging.py \
            --base-url "$BACKEND_BASE_URL" --token "$ADMIN_TASK_TOKEN" \
            --slugs-file /tmp/batch_slugs.txt
          status="$(git status --porcelain backend/app/seed_templates.py)"
          if [ -z "$status" ]; then
            echo "No image changes since the original auto-bake -- nothing to do."
          else
            git config user.name "tulo-content-bot"
            git config user.email "content-bot@users.noreply.github.com"
            git add backend/app/seed_templates.py
            git commit -m "Bake batch 17's current staging images onto main" -m "Tulo-Batch-Number: 17"
            git push origin main
            echo "Committed and pushed updated images for batch 17."
          fi
      - name: Report merged_at back to the backend
        run: |
          curl -sf "${{ vars.BACKEND_BASE_URL }}/admin/review-queue/mark-merged?token=${{ secrets.ADMIN_TASK_TOKEN }}&batch=17"
