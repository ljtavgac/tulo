name: Merge approved batch to main

# Triggered by the backend's /admin/review-queue/approve-for-prod endpoint
# (see backend/app/main.py's _trigger_batch_merge) the moment a batch is
# approved in the admin portal -- not on a schedule. This is the only place
# in the whole pipeline that needs a real git push credential (the
# auto-provisioned, run-scoped GITHUB_TOKEN below, granted contents:write
# just for this job); the always-on Render web service never holds one,
# only a narrow Actions:write-only PAT that can start this workflow and
# nothing else.
on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: "batch_number to cherry-pick from staging onto main"
        required: true

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Cherry-pick the approved batch's commit onto main
        run: |
          set -euo pipefail
          git fetch origin staging
          # daily_batch.py stamps every batch commit's message with a
          # "Tulo-Batch-Number: <N>" trailer (see content/scripts/
          # daily_batch.py) -- that's what makes this lookup possible
          # without a git tag. Tags looked like the obvious choice here,
          # but this repo's push credentials can create branches, not tag
          # refs (a real permission boundary, confirmed by a live 403 on a
          # tag push during setup) -- a commit trailer needs nothing more
          # than the same push access already used for everything else.
          # The trailing ([^0-9]|$) keeps batch 999 from matching batch
          # 9999's trailer.
          SHA="$(git log origin/staging -E --grep="Tulo-Batch-Number: ${{ inputs.batch_number }}([^0-9]|\$)" --format=%H -n 1)"
          if [ -z "$SHA" ]; then
            echo "No commit on staging carries Tulo-Batch-Number: ${{ inputs.batch_number }}" >&2
            exit 1
          fi
          echo "Merging $SHA onto main"
          git config user.name "tulo-content-bot"
          git config user.email "content-bot@users.noreply.github.com"

          if ! git cherry-pick "$SHA"; then
            conflicted="$(git diff --name-only --diff-filter=U)"
            # content/CONTENT_QUEUE.csv is pure pipeline bookkeeping --
            # daily_batch.py is the only thing that ever writes it, and it
            # always writes to staging, so staging's copy is the one true
            # current state; main's copy is just a mirror for repo history
            # and nothing running in prod ever reads it. A conflict here
            # (confirmed for real on batch 6's first live merge: main's
            # copy had never picked up any of staging's claim/publish
            # churn, so a plain 3-way merge on this one file couldn't
            # apply cleanly) is safe to resolve by taking staging's
            # version outright rather than diffing row by row.
            if [ "$conflicted" = "content/CONTENT_QUEUE.csv" ]; then
              echo "Resolving CONTENT_QUEUE.csv conflict by taking staging's copy wholesale"
              git checkout --theirs content/CONTENT_QUEUE.csv
              git add content/CONTENT_QUEUE.csv
              git -c core.editor=true cherry-pick --continue
            else
              echo "Cherry-pick conflict in more than just CONTENT_QUEUE.csv -- needs human resolution:" >&2
              echo "$conflicted" >&2
              git cherry-pick --abort
              exit 1
            fi
          fi

          git push origin main

      - name: Report merged_at back to the backend
        run: |
          curl -sf "${{ vars.BACKEND_BASE_URL }}/admin/review-queue/mark-merged?token=${{ secrets.ADMIN_TASK_TOKEN }}&batch=${{ inputs.batch_number }}"
