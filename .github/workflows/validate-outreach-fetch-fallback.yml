name: Validate outreach fetch Playwright fallback (one-off diagnostic)

on:
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 anthropic playwright
          playwright install --with-deps chromium

      - name: Validate
        run: python3 content/scripts/validate_outreach_fetch_fallback.py
