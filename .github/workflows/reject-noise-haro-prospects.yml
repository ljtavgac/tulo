name: Reject noise haro_reply prospects (one-off batch)

# Cleans up the backlog from forwarding being set on the whole inbox
# (fixed now to only forward HARO mail): rejects every queued, non-example
# haro_reply prospect that isn't a real HARO digest (GitHub Actions
# notifications, account-security alerts, marketing email, spam). See
# content/scripts/reject_noise_haro_prospects.py for the exact rule.
# Never approves, sends, or deletes anything -- reject only flips status,
# reversible via the portal's own undo link.
on:
  workflow_dispatch: {}

jobs:
  reject-noise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Reject noise prospects
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          OUTREACH_ADMIN_USER: ${{ secrets.OUTREACH_ADMIN_USER }}
          OUTREACH_ADMIN_PASSWORD: ${{ secrets.OUTREACH_ADMIN_PASSWORD }}
        run: |
          python3 content/scripts/reject_noise_haro_prospects.py
