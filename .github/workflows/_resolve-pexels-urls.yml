name: DIAG resolve pexels URLs (temporary)

on:
  workflow_dispatch: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Resolve pexels URLs
        run: |
          python3 content/scripts/_resolve_pexels_urls.py
