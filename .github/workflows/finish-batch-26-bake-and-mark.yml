name: Finish batch 26 - bake images and mark merged (one-off)

# The cherry-pick step of batch 26's merge was done by hand (a real merge
# conflict needed human resolution -- see merge-approved-batch.yml's own
# comment on this exact failure mode) and already pushed directly to
# main. This just runs the two steps that normally follow a clean
# cherry-pick: capture batch 26's current staging image state onto main,
# then tell the backend this batch is merged so BatchApproval.merged_at
# gets set and nothing keeps retrying it.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Bake batch 26's current staging images onto main
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          ADMIN_TASK_TOKEN: ${{ secrets.ADMIN_TASK_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tulo-content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          python3 content/scripts/batch_slugs.py 26 > /tmp/batch26_slugs.txt
          cat /tmp/batch26_slugs.txt
          python3 content/scripts/bake_images_from_staging.py \
            --base-url "$BACKEND_BASE_URL" --token "$ADMIN_TASK_TOKEN" \
            --slugs-file /tmp/batch26_slugs.txt

          status="$(git status --porcelain backend/app/seed_templates.py)"
          if [ -z "$status" ]; then
            echo "No image changes to bake -- nothing to do."
          else
            git add backend/app/seed_templates.py
            git commit \
              -m "Bake batch(es) 26's current staging images onto main" \
              -m "Captures any review-time image correction made AFTER the original auto-bake." \
              -m "Tulo-Batch-Number: 26"
            git push origin main
          fi

      - name: Mark batch 26 merged on the backend
        run: |
          curl -sf "${{ vars.BACKEND_BASE_URL }}/admin/review-queue/mark-merged?token=${{ secrets.ADMIN_TASK_TOKEN }}&batch=26"
