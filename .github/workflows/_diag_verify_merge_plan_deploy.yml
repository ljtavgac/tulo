name: _diag verify merge-plan deploy

# Throwaway diagnostic: confirms the _resolve_merge_plan / _retry_stale_
# batch_approvals changes (commit merging batch-number tracking away from
# the reviewer) actually deployed cleanly on both staging and prod, by
# hitting /admin/review-queue (which calls _retry_stale_batch_approvals on
# every load) and confirming a 200, not a 500 traceback. Deleted after use.
on:
  workflow_dispatch:
    inputs:
      staging_commit:
        description: "git SHA staging's /health should report before checking"
        required: true
      prod_commit:
        description: "git SHA prod's /health should report before checking"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for and check staging
        env:
          BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          TOKEN: ${{ secrets.ADMIN_TASK_TOKEN }}
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 480))
          while [ "$SECONDS" -lt "$deadline" ]; do
            live_commit="$(curl -sS --connect-timeout 10 --max-time 20 "$BASE_URL/health" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("git_commit") or "")' 2>/dev/null || true)"
            if [ "$live_commit" = "${{ inputs.staging_commit }}" ]; then
              echo "staging is now serving ${{ inputs.staging_commit }} -- landed after ${SECONDS}s."
              break
            fi
            echo "staging is on '${live_commit:-<unreachable>}', waiting ($SECONDS s elapsed)..."
            sleep 15
          done
          echo "=== staging /admin/review-queue ==="
          code="$(curl -sS -o /tmp/staging_review_queue.html -w '%{http_code}' --connect-timeout 15 --max-time 30 "$BASE_URL/admin/review-queue?token=$TOKEN&batch=all")"
          echo "http_code=$code"
          if [ "$code" != "200" ]; then
            echo "::error::staging /admin/review-queue returned $code"
            tail -c 2000 /tmp/staging_review_queue.html
            exit 1
          fi
          echo "staging OK"

      - name: Wait for and check prod
        env:
          BASE_URL: ${{ vars.PROD_BACKEND_BASE_URL }}
          TOKEN: ${{ secrets.PROD_ADMIN_TASK_TOKEN }}
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 480))
          while [ "$SECONDS" -lt "$deadline" ]; do
            live_commit="$(curl -sS --connect-timeout 10 --max-time 20 "$BASE_URL/health" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("git_commit") or "")' 2>/dev/null || true)"
            if [ "$live_commit" = "${{ inputs.prod_commit }}" ]; then
              echo "prod is now serving ${{ inputs.prod_commit }} -- landed after ${SECONDS}s."
              break
            fi
            echo "prod is on '${live_commit:-<unreachable>}', waiting ($SECONDS s elapsed)..."
            sleep 15
          done
          echo "=== prod /admin/review-queue ==="
          code="$(curl -sS -o /tmp/prod_review_queue.html -w '%{http_code}' --connect-timeout 15 --max-time 30 "$BASE_URL/admin/review-queue?token=$TOKEN&batch=all")"
          echo "http_code=$code"
          if [ "$code" != "200" ]; then
            echo "::error::prod /admin/review-queue returned $code"
            tail -c 2000 /tmp/prod_review_queue.html
            exit 1
          fi
          echo "prod OK"
