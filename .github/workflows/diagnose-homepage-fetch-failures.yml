name: Diagnose homepage fetch failures in outreach sourcing (one-off diagnostic)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Diagnose
        run: python3 content/scripts/diagnose_homepage_fetch_failures.py
