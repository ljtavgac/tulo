name: Diagnose staging/prod image drift (one-off)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set to "true" to actually write prod values onto staging (default: dry run only)'
        required: false
        default: 'false'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Root-cause evidence for the 2 reported slugs
        env:
          PROD_BACKEND_BASE_URL: ${{ vars.PROD_BACKEND_BASE_URL }}
          PROD_ADMIN_TASK_TOKEN: ${{ secrets.PROD_ADMIN_TASK_TOKEN }}
          STAGING_BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          STAGING_ADMIN_TASK_TOKEN: ${{ secrets.ADMIN_TASK_TOKEN }}
        run: python3 content/scripts/_diagnose_image_drift.py

      - name: Full-site staging-vs-prod image scan (dry run unless apply=true)
        env:
          PROD_BACKEND_BASE_URL: ${{ vars.PROD_BACKEND_BASE_URL }}
          PROD_ADMIN_TASK_TOKEN: ${{ secrets.PROD_ADMIN_TASK_TOKEN }}
          STAGING_BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          STAGING_ADMIN_TASK_TOKEN: ${{ secrets.ADMIN_TASK_TOKEN }}
          DRY_RUN: ${{ inputs.apply == 'true' && 'false' || 'true' }}
        run: python3 content/scripts/sync_staging_images_to_prod.py
