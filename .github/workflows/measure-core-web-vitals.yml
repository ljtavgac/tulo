name: Measure Core Web Vitals (one-off diagnostic)

on:
  workflow_dispatch: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Measure
        env:
          PROD_BACKEND_BASE_URL: ${{ vars.PROD_BACKEND_BASE_URL }}
        run: python3 content/scripts/measure_core_web_vitals.py
