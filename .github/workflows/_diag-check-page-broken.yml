name: _diag check broken page (batch 12)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Check prod page + API
        env:
          BACKEND_BASE_URL: ${{ vars.PROD_BACKEND_BASE_URL }}
        run: python3 content/scripts/_diag_check_page_broken.py

      - name: Compare full content against a working page
        env:
          BACKEND_BASE_URL: ${{ vars.PROD_BACKEND_BASE_URL }}
        run: python3 content/scripts/_diag_compare_working_page.py
