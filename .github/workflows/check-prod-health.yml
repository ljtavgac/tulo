name: Check prod health

# Minimal one-off: curls PRODUCTION's public GET /health (no token needed)
# and echoes the raw JSON, so prod's currently-deployed git_commit can be
# confirmed from outside this sandbox's own network egress restrictions
# (the sandbox proxy blocks *.onrender.com directly -- this workflow runs
# on a GitHub-hosted runner instead, which has no such restriction).
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Curl prod /health
        env:
          PROD_BACKEND_BASE_URL: ${{ vars.PROD_BACKEND_BASE_URL }}
        run: |
          curl -sS --connect-timeout 15 --max-time 30 "$PROD_BACKEND_BASE_URL/health"
