name: Diagnose sitemap gaps (one-off)

# Checks the live https://tulo.io/sitemap.xml and homepage canonical tag
# for evidence of whether /, /about, /privacy are present, before changing
# sitemap.ts. Runs on a GitHub-hosted runner since the sandbox's own
# network egress doesn't reach tulo.io directly.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 content/scripts/_diagnose_sitemap_gaps.py
