name: Backlink-gap outreach (Semrush)

# Standalone manual-dispatch entry for content/scripts/backlink_gap_outreach.py.
# NOT currently part of daily-link-building.yml's daily run -- there's no
# Semrush API subscription/key available right now (confirmed live: every
# competitor lookup 400s with an empty key). Kept here so this source can
# be tested or turned back on the moment a SEMRUSH_API_KEY secret exists --
# see that script's module docstring for what else its Semrush call shape
# still needs a live first-run verification once a real key is available.
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Max prospects to queue this run (default: fill the full remaining shared daily quota)'
        required: false
        default: ''
      dry_run:
        description: 'true = print what would be queued without creating anything'
        required: false
        default: 'false'

jobs:
  source-outreach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 anthropic playwright
          playwright install --with-deps chromium

      - name: Source and queue outreach prospects
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          OUTREACH_ADMIN_USER: ${{ secrets.OUTREACH_ADMIN_USER }}
          OUTREACH_ADMIN_PASSWORD: ${{ secrets.OUTREACH_ADMIN_PASSWORD }}
          PIPELINE_ANTHROPIC_API_KEY: ${{ secrets.PIPELINE_ANTHROPIC_API_KEY }}
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
        run: |
          set -uo pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.count }}" ]; then
            ARGS="--count ${{ github.event.inputs.count }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 content/scripts/backlink_gap_outreach.py $ARGS
