name: Override and bake chicha image (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Set image on staging + bake into seed_templates.py
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          ADMIN_TASK_TOKEN: ${{ secrets.ADMIN_TASK_TOKEN }}
        run: python3 content/scripts/_override_and_bake_chicha.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "tulo-content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain backend/app/seed_templates.py)" ]; then
            echo "No changes to bake -- nothing to commit."
          else
            git add backend/app/seed_templates.py
            git commit -m "Bake chicha page's image into seed_templates.py ahead of its merge"
            git push origin staging
          fi
