name: Count sitemap URLs (one-off diagnostic)

on:
  workflow_dispatch: {}

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Count
        run: python3 content/scripts/count_sitemap_urls.py
