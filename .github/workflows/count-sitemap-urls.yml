name: Count sitemap URLs (one-off diagnostic)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site to check (defaults to prod)"
        required: false
        default: "https://tulo.io"
      check_urls:
        description: "Comma-separated exact <loc> URLs to spot-check for presence"
        required: false
        default: ""

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Count
        env:
          SITE_URL: ${{ inputs.site_url }}
          CHECK_URLS: ${{ inputs.check_urls }}
        run: python3 content/scripts/count_sitemap_urls.py
