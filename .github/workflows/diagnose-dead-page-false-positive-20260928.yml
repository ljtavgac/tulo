name: Diagnose dead-page false positive (one-off)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Diagnose
        run: python3 content/scripts/diagnose_dead_page_false_positive_20260928.py
