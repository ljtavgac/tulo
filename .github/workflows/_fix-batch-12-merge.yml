name: _fix batch 12 merge (one-off)

# One-off: content/scripts/generate_haro_article.py's commit for batch 12
# (the butter-vs-shortening HARO article, prospect #38) never carried the
# "Tulo-Batch-Number: 12" trailer merge-approved-batch.yml's cherry-pick
# step requires, so clicking "Approve for prod" dispatched that workflow
# and it failed immediately with "No commit on staging carries
# Tulo-Batch-Number: 12". Mirrors that workflow's real steps, but cherry-
# picks the known commit SHA directly instead of looking it up by
# trailer. Deleted after use -- generate_haro_article.py has been fixed
# to stamp the trailer going forward, so this workaround is never needed
# again.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cherry-pick the known commit onto main
        run: |
          set -euo pipefail
          git fetch origin staging
          git config user.name "tulo-content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git cherry-pick 55d7af96f11a16b5b58faeb28a1cc05ffa39cbb7

      - name: Bake batch 12's current staging image state onto main
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          ADMIN_TASK_TOKEN: ${{ secrets.ADMIN_TASK_TOKEN }}
        run: |
          set -euo pipefail
          python3 content/scripts/batch_slugs.py 12 > /tmp/batch_slugs.txt
          echo "Slugs in batch 12:"
          cat /tmp/batch_slugs.txt
          python3 content/scripts/bake_images_from_staging.py \
            --base-url "$BACKEND_BASE_URL" --token "$ADMIN_TASK_TOKEN" \
            --slugs-file /tmp/batch_slugs.txt

          status="$(git status --porcelain backend/app/seed_templates.py)"
          if [ -z "$status" ]; then
            echo "No image changes -- nothing to bake."
          else
            git add backend/app/seed_templates.py
            git commit \
              -m "Bake batch 12's current staging images onto main" \
              -m "One-off manual merge: the original HARO article commit never carried a Tulo-Batch-Number trailer, so the automated merge-approved-batch.yml workflow couldn't find it. See generate_haro_article.py's fix for the same trailer going forward." \
              -m "Tulo-Batch-Number: 12"
          fi

      - name: Push main
        run: git push origin main

      - name: Report merged_at back to the backend
        run: |
          curl -sf "${{ vars.BACKEND_BASE_URL }}/admin/review-queue/mark-merged?token=${{ secrets.ADMIN_TASK_TOKEN }}&batch=12"
