name: _diag check live SEO surfaces

# Throwaway diagnostic: this sandbox's own network egress is blocked from
# reaching tulo.io directly (org policy on the agent's proxy), so this
# pulls the actual live robots.txt, sitemap.xml, and one deep page's raw
# HTML from a GitHub-hosted runner instead, which has no such restriction.
# Investigating why Search Console shows only 2 pages indexed against a
# site with ~2,690 real pages. Deleted after use.
on:
  workflow_dispatch:
    inputs:
      sample_slug:
        description: "A real recipe_or_dish slug to fetch and inspect (e.g. banana-nut-bread)"
        required: true
        default: "banana-nut-bread"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch robots.txt
        run: |
          set -uo pipefail
          echo "=== https://tulo.io/robots.txt ==="
          curl -sS -w '\nhttp_code=%{http_code} time_total=%{time_total}s\n' --connect-timeout 10 --max-time 20 -L "https://tulo.io/robots.txt" || echo "(request failed)"

      - name: Fetch sitemap.xml (headers + size + first/last entries)
        run: |
          set -uo pipefail
          echo "=== https://tulo.io/sitemap.xml ==="
          code="$(curl -sS -o /tmp/sitemap.xml -w '%{http_code}' --connect-timeout 15 --max-time 60 -L "https://tulo.io/sitemap.xml")"
          echo "http_code=$code"
          if [ -f /tmp/sitemap.xml ]; then
            echo "byte size: $(wc -c < /tmp/sitemap.xml)"
            echo "url count: $(grep -c '<loc>' /tmp/sitemap.xml || echo 0)"
            echo "--- first 5 <loc> entries ---"
            grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | head -5
            echo "--- last 5 <loc> entries ---"
            grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | tail -5
            echo "--- first 30 lines raw (in case it's not valid XML / is an error page) ---"
            head -c 2000 /tmp/sitemap.xml
          fi

      - name: Fetch a sample deep page's raw HTML
        run: |
          set -uo pipefail
          SLUG="${{ inputs.sample_slug }}"
          URL="https://tulo.io/food/recipes/$SLUG"
          echo "=== $URL ==="
          code="$(curl -sS -o /tmp/page.html -w '%{http_code}' --connect-timeout 15 --max-time 60 -L "$URL")"
          echo "http_code=$code"
          if [ -f /tmp/page.html ]; then
            echo "byte size: $(wc -c < /tmp/page.html)"
            echo "--- <title> ---"
            grep -o '<title>[^<]*</title>' /tmp/page.html | head -1
            echo "--- meta robots tag, if any ---"
            grep -o '<meta name="robots"[^>]*>' /tmp/page.html || echo "(none found)"
            echo "--- canonical link tag ---"
            grep -o '<link rel="canonical"[^>]*>' /tmp/page.html || echo "(none found)"
            echo "--- does the raw HTML contain real recipe text (grep for a distinctive phrase)? ---"
            grep -o "Preheat the oven" /tmp/page.html || echo "(phrase not found in raw HTML -- may be client-rendered only)"
          fi

      - name: Timing check -- fetch homepage 3x to see response time variance (cold start check)
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            echo "=== homepage fetch $i ==="
            curl -sS -o /dev/null -w 'http_code=%{http_code} time_total=%{time_total}s\n' --connect-timeout 15 --max-time 60 -L "https://tulo.io/"
            sleep 2
          done
