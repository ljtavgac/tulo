name: _diag close 9999 and verify fix

# Throwaway diagnostic: (1) marks the orphaned batch-9999 BatchApproval row
# merged on prod so it stops being a candidate row at all (bookkeeping --
# the code fix already makes it harmless either way), (2) confirms both
# staging and prod's /admin/review-queue still return 200 after the
# _resolve_merge_plan eligibility-guard fix deployed. No wait loop -- see
# the earlier _diag_verify_merge_plan_deploy.yml's history for why. Deleted
# after use.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Mark ghost batch 9999 merged on prod (bookkeeping cleanup)
        env:
          BASE_URL: ${{ vars.PROD_BACKEND_BASE_URL }}
          TOKEN: ${{ secrets.PROD_ADMIN_TASK_TOKEN }}
        run: |
          set -uo pipefail
          code="$(curl -sS -o /tmp/mark_merged_9999.json -w '%{http_code}' --connect-timeout 15 --max-time 30 "$BASE_URL/admin/review-queue/mark-merged?token=$TOKEN&batch=9999")"
          echo "http_code=$code"
          cat /tmp/mark_merged_9999.json
          echo

      - name: Check staging review-queue
        env:
          BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          TOKEN: ${{ secrets.ADMIN_TASK_TOKEN }}
        run: |
          set -uo pipefail
          echo "=== staging /health ==="
          curl -sS --connect-timeout 10 --max-time 20 "$BASE_URL/health" || echo "(unreachable)"
          echo
          code="$(curl -sS -o /tmp/staging_rq.html -w '%{http_code}' --connect-timeout 15 --max-time 30 "$BASE_URL/admin/review-queue?token=$TOKEN&batch=all")"
          echo "staging http_code=$code"
          if [ "$code" != "200" ]; then
            echo "::error::staging /admin/review-queue returned $code"
            tail -c 2000 /tmp/staging_rq.html
            exit 1
          fi
          echo "staging OK"

      - name: Check prod review-queue
        env:
          BASE_URL: ${{ vars.PROD_BACKEND_BASE_URL }}
          TOKEN: ${{ secrets.PROD_ADMIN_TASK_TOKEN }}
        run: |
          set -uo pipefail
          echo "=== prod /health ==="
          curl -sS --connect-timeout 10 --max-time 20 "$BASE_URL/health" || echo "(unreachable)"
          echo
          code="$(curl -sS -o /tmp/prod_rq.html -w '%{http_code}' --connect-timeout 15 --max-time 30 "$BASE_URL/admin/review-queue?token=$TOKEN&batch=all")"
          echo "prod http_code=$code"
          if [ "$code" != "200" ]; then
            echo "::error::prod /admin/review-queue returned $code"
            tail -c 2000 /tmp/prod_rq.html
            exit 1
          fi
          echo "prod OK"
