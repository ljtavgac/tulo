name: Check live robots.txt (one-off diagnostic)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check
        env:
          FRONTEND_BASE_URL: https://tulo.io
        run: python3 content/scripts/check_robots_txt.py
