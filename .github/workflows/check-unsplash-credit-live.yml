name: Check live Unsplash credit (one-off diagnostic)

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "space-separated slugs to check"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Check
        run: python3 content/scripts/check_unsplash_credit_live.py ${{ inputs.slugs }}
